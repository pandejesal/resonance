name: Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend
        run: cargo build --release -p resonance-backend

      - name: Assemble release dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\static | Out-Null
          Copy-Item target\release\resonance-backend.exe release\
          Copy-Item frontend\dist\* release\static\ -Recurse
          Copy-Item VERSION release\

      - name: Compile installer
        working-directory: installer
        shell: pwsh
        run: |
          $ver = (Get-Content ..\VERSION).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" windows.iss

      - uses: actions/upload-artifact@v4
        with:
          name: resonance-windows
          path: installer/installer_output/*.exe

  linux:
    name: Linux amd64 deb + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev librsvg2-bin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lin-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lin-cargo-

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend
        run: cargo build --release -p resonance-backend

      - name: Assemble release dir
        run: |
          mkdir -p release/static
          cp target/release/resonance-backend release/
          cp -r frontend/dist/* release/static/
          cp VERSION release/

      - name: Build .deb
        working-directory: installer
        run: ./build-deb.sh

      - name: Build AppImage
        working-directory: installer
        run: ./build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: resonance-linux
          path: |
            installer/*.deb
            installer/*.AppImage

  macos-x64:
    name: macOS x86_64 dmg + pkg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install create-dmg + librsvg
        run: brew install create-dmg librsvg

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mac-x64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: mac-x64-cargo-

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend
        run: cargo build --release -p resonance-backend --target x86_64-apple-darwin

      - name: Assemble release dir
        run: |
          mkdir -p release/static
          cp target/x86_64-apple-darwin/release/resonance-backend release/
          cp -r frontend/dist/* release/static/
          cp VERSION release/

      - name: Build DMG
        working-directory: installer
        env:
          ARCH: x86_64
        run: ./build-dmg.sh

      - name: Build PKG
        working-directory: installer
        env:
          ARCH: x86_64
        run: ./build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: resonance-macos-x86_64
          path: installer/resonance-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: resonance-macos-x86_64-pkg
          path: installer/resonance-*.pkg

  macos-arm64:
    name: macOS arm64 dmg + pkg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install create-dmg + librsvg
        run: brew install create-dmg librsvg

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mac-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: mac-arm64-cargo-

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend
        run: cargo build --release -p resonance-backend --target aarch64-apple-darwin

      - name: Assemble release dir
        run: |
          mkdir -p release/static
          cp target/aarch64-apple-darwin/release/resonance-backend release/
          cp -r frontend/dist/* release/static/
          cp VERSION release/

      - name: Build DMG
        working-directory: installer
        env:
          ARCH: arm64
        run: ./build-dmg.sh

      - name: Build PKG
        working-directory: installer
        env:
          ARCH: arm64
        run: ./build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: resonance-macos-arm64
          path: installer/resonance-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: resonance-macos-arm64-pkg
          path: installer/resonance-*.pkg

  android:
    name: Android APK (arm64 + armv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android Targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build backend for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 29 build --release -p resonance-backend

      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp target/aarch64-linux-android/release/libresonance_backend.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libresonance_backend.so android/app/src/main/jniLibs/armeabi-v7a/
          mkdir -p android/app/src/main/assets/static
          cp -r frontend/dist/* android/app/src/main/assets/static/

      - name: Setup Android debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK with version
        run: |
          VER=$(cat VERSION)
          cp android/app/build/outputs/apk/debug/app-debug.apk resonance-$VER-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: resonance-android
          path: resonance-*-android.apk

  release:
    name: Attach artifacts to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos-x64, macos-arm64, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
