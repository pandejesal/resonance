[package]
name = "resonance"
version = "0.5.3"
edition = "2021"
description = "A self-hosted music archival system"
authors = ["pandejesal"]
license = "MIT"

[[bin]]
name = "resonance"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
resonance-backend = { path = "../backend" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
